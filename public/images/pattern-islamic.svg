<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Seamless Islamic 8-pointed star lattice tile. Used as a repeating
       background at very low opacity on dark navy sections (white strokes). -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1">
    <!-- Eight-pointed star (two overlapping squares) centered in the tile -->
    <rect x="28" y="28" width="40" height="40"/>
    <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    <!-- Corner quarter-stars so the tile repeats seamlessly -->
    <g>
      <rect x="-20" y="-20" width="40" height="40"/>
      <rect x="-20" y="-20" width="40" height="40" transform="rotate(45 0 0)"/>
      <rect x="76" y="-20" width="40" height="40"/>
      <rect x="76" y="-20" width="40" height="40" transform="rotate(45 96 0)"/>
      <rect x="-20" y="76" width="40" height="40"/>
      <rect x="-20" y="76" width="40" height="40" transform="rotate(45 0 96)"/>
      <rect x="76" y="76" width="40" height="40"/>
      <rect x="76" y="76" width="40" height="40" transform="rotate(45 96 96)"/>
    </g>
    <!-- Inner diamond accent -->
    <rect x="41" y="41" width="14" height="14" transform="rotate(45 48 48)"/>
  </g>
</svg>
